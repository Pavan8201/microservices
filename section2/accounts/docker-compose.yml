services:
  accounts:
    image: "pavangokavi/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - pavangokavi
  loans:
    image: "pavangokavi/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - pavangokavi
  cards:
    image: "pavangokavi/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - pavangokavi
networks:
  pavangokavi:
    driver: "bridge"